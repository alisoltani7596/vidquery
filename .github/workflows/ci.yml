name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TORCH_INDEX: https://download.pytorch.org/whl/cpu
  HF_HUB_OFFLINE: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff==0.17.0"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU torch)
        run: |
          pip install torch --index-url "$TORCH_INDEX"
          pip install -e ".[cpu,dev]"
      - run: mypy

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU torch)
        run: |
          pip install torch --index-url "$TORCH_INDEX"
          pip install -e ".[cpu,dev]"
      - name: CPU tests (GPU-marked tests are skipped)
        run: pytest -m "not gpu" -ra --durations=10
      - name: Weight-free end-to-end smoke test
        run: |
          python scripts/make_synthetic_data.py --out data/synthetic
          vidquery ingest data/synthetic/synthetic.mp4 -c configs/mock.yaml
          vidquery query "a person in red" -c configs/mock.yaml -k 3
          python scripts/eval_retrieval.py -c configs/mock.yaml \
            --queries data/synthetic/queries.jsonl --verifier off
          vidquery demo "a person in blue" -c configs/mock.yaml --out results/demo.gif
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: |
            results/eval.md
            results/demo.gif
          if-no-files-found: warn

  docker-cpu:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cpu
          tags: vidquery:cpu
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: |
          docker run --rm vidquery:cpu --help
          docker run --rm --entrypoint python vidquery:cpu -c "import vidquery, faiss, onnxruntime, torch; print('ok', torch.__version__)"
