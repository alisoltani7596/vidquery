[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vidquery"
version = "0.1.0"
description = "Text-to-video search: person detection, SigLIP embeddings, FAISS retrieval and optional VLM verification."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ali Soltaninezhad", email = "alisoltani7596@gmail.com" }]
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "faiss-cpu>=1.8",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # torch/torchvision are installed separately so the right CPU/CUDA wheel can be chosen.
    "torch>=2.3",
    "transformers>=4.47",
    "onnx>=1.16",
    "onnxscript>=0.1",
]

[project.optional-dependencies]
# CPU inference for the onnxruntime backend. Do not combine with the `gpu` extra.
cpu = ["onnxruntime>=1.18"]
# GPU extras used inside the NGC TensorRT container (tensorrt itself comes from the container).
gpu = [
    "onnxruntime-gpu>=1.18",
    "nvidia-ml-py>=12.535",
    "onnxconverter-common>=1.14",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
]
# onnxslim is listed explicitly so Ultralytics never tries to pip-install it on offline nodes.
yolo = ["ultralytics>=8.3.200", "onnxslim>=0.1.50"]
int8 = ["nvidia-modelopt[onnx]>=0.27"]
dev = ["pytest>=8.0", "ruff==0.17.0", "mypy==2.4.0", "types-PyYAML>=6.0"]

[project.scripts]
vidquery = "vidquery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vidquery = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT"]
ignore = [
    "N812",   # `import torch.nn.functional as F` is idiomatic
    "RUF001", # allow unicode in strings (e.g. ×)
    "RUF002",
    "RUF003",
    "PT018",  # compound assertions are fine in tests
    "PT011",  # pytest.raises(ValueError) without match is fine for simple cases
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N806"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["vidquery"]
strict = true
warn_unused_ignores = true
disallow_any_generics = false
disallow_untyped_calls = false
disallow_subclassing_any = false
warn_return_any = false

[[tool.mypy.overrides]]
module = [
    "faiss.*",
    "tensorrt.*",
    "ultralytics.*",
    "onnxruntime.*",
    "pynvml.*",
    "modelopt.*",
    "onnxconverter_common.*",
    "transformers.*",
    "cv2.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gpu: needs a CUDA GPU (skipped automatically when CUDA is unavailable)",
    "slow: slower CPU tests (ONNX export with the dynamo exporter)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore:.*TracerWarning.*",
]
